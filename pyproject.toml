[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-language-localization"
version = "0.1.0"
description = "Vision-Language assisted localization and runtime safety analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Qurban" }
]
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vision_language_localization*"]
